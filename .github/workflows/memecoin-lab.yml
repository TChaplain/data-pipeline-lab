name: memecoin-lab
on:
  schedule:
    - cron: '0 */2 * * *'   # every 2h keeps a PRIVATE repo inside the free 2,000 min/month (each run ~2-3 min). If the repo is public, minutes are free: use '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: journal, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/memecoin_lab.py
      - name: Commit journal
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add journal
          git diff --cached --quiet || git commit -m "meme lab: $(date -u +'%F %H:%M')"
          git pull --rebase && git push
