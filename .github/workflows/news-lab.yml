name: news-lab
on:
  schedule:
    - cron: '5 * * * 1-5'   # hourly on weekdays
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: journal, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run news lab
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/news_lab.py
      - name: Commit journal
        run: |
          git config user.name "paper-trader-bot"
          git config user.email "actions@users.noreply.github.com"
          git add journal
          git diff --cached --quiet || git commit -m "news lab: $(date -u +'%F %H:%M')"
          git pull --rebase && git push
# schedule re-registered 2026-11-12
